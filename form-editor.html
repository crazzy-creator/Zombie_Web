<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Form-Editor</title>
<style>
  html,body{margin:0;height:100%;background:#141010;color:#e6dcdc;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
  #app{display:flex;flex-direction:column;height:100%}
  #app.rot{position:fixed;left:0;top:0;transform-origin:0 0}
  @media (max-width:700px){button,select,label.btn{padding:5px 7px;font-size:12px}.row{gap:5px;font-size:12px}input[type=range]{width:90px}header h1{display:none}}
  header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px;padding-top:calc(6px + max(env(safe-area-inset-top), var(--top, 0px)));padding-left:max(6px, env(safe-area-inset-left));padding-right:max(6px, env(safe-area-inset-right));background:#1c1616;border-bottom:1px solid #3a2e2e}
  header h1{font-size:15px;margin:0 8px 0 2px}
  button,select,label.btn{background:#2a2222;color:#ddd;border:1px solid #4a4040;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
  button.sel,button.main{background:#7a1318;border-color:#c4373e;color:#fff}
  main{flex:1;display:flex;flex-direction:column;padding:6px;gap:6px;min-height:0}
  .box{flex:1;min-height:0;background:#0c0909;border:1px solid #3a2e2e;border-radius:10px;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
  input[type=range]{accent-color:#c4373e;width:110px}
  .hint{font-size:12px;color:#a89898}
  #drawer{display:none;flex-direction:column;gap:8px;padding:8px;background:#1c1616;border-bottom:1px solid #3a2e2e}
  #drawer.open{display:flex}
  #status{min-height:16px;line-height:16px}
  details summary{cursor:pointer;color:#a89898;font-size:12px;padding:3px 0}
  #chk{position:absolute;left:8px;right:8px;bottom:8px;max-height:60%;overflow:auto;background:rgba(18,14,14,.96);border:1px solid #5a4646;border-radius:10px;padding:10px;display:none;z-index:6;font-size:12px}
  #chk.open{display:block}
  #chk li{margin:3px 0}
  #meas{position:absolute;left:8px;bottom:8px;width:min(420px,calc(100% - 16px));max-height:70%;overflow:auto;background:rgba(18,14,14,.97);border:1px solid #5a4646;border-radius:10px;padding:10px;display:none;z-index:6;font-size:12px}
  #meas.open{display:block}
  #meas .m{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
  #meas input[type=number]{width:64px;background:#0c0909;color:#ddd;border:1px solid #4a4040;border-radius:6px;padding:4px}
  #chk .bad{color:#ff8a8a}#chk .ok{color:#8aff9a}#chk .warn{color:#ffd37a}
  #pv{position:absolute;top:6px;right:6px;width:150px;height:262px;background:#171212;border:1px solid #5a4646;border-radius:8px;z-index:4;overflow:hidden;touch-action:none}
  #pv canvas{width:100%;height:100%}
  #pvbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:3px;padding:3px;background:rgba(10,8,8,.7);font-size:11px;align-items:center}
  #pvbar button{padding:2px 6px;font-size:11px}
  #ovl{position:absolute;inset:0;background:rgba(10,8,8,.95);display:none;flex-direction:column;gap:8px;padding:12px;z-index:5}
  #ovl.open{display:flex}
  #ovl textarea{flex:1;background:#0c0909;color:#ddd;border:1px solid #4a4040;border-radius:8px;font-size:12px;padding:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menu">☰ Menü</button>
    <select id="part"></select>
    <button id="btnDone" title="Dieses Teil sperren, damit nichts mehr aus Versehen verschoben oder gespiegelt wird">✔ Fertig</button>
    <button id="undo" title="Rückgängig">↶</button>
    <button id="redo" title="Wiederholen">↷</button>
    <button id="check">Prüfen</button>
    <button id="apply" class="main">Übernehmen</button>
    <button id="close" style="display:none">Schließen</button>
  </header>
  <div id="drawer">
    <div class="row"><label>Figur <select id="kind"></select></label>
      <label id="rotLbl">Ansicht <select id="rot" title="Ansicht drehen"><option value="0">Querformat</option><option value="90">Hochformat (Handy nach links gekippt)</option><option value="-90">Hochformat (Handy nach rechts gekippt)</option></select></label></div>
    <div class="row"><label class="btn">Referenzbild laden<input id="file" type="file" accept="image/*" style="display:none"></label>
      <button id="xfer">Export / Import</button>
      <button id="projSave" title="Alles in EINE Datei: Referenzbild (Original), Ausrichtungen, Form, Knochen, Finger, Gelenke, Ebenen, Haut-Texturen …">💾 Projekt speichern</button><label class="btn" title="Eine gespeicherte Projektdatei wieder laden (gleiche Figur)">📂 Projekt laden<input id="projFile" type="file" accept=".json,.zdproj,application/json" style="display:none"></label><button id="resetAll">Figur zurücksetzen</button></div>
    <div class="row"><label><input id="showBase" type="checkbox"> Grundform (gestrichelt) zeigen</label><label><input id="keepRef" type="checkbox" checked> Bild &amp; Ausrichtung merken</label><label><input id="useRef" type="checkbox" checked> Haut aus Referenzbild übernehmen</label></div>
    <div class="hint" id="info"></div>
    <div class="row"><button id="menuClose" class="main">Fertig</button></div>
  </div>
  <main>
    <div class="row">
      <button id="mBone" class="sel">1 Knochen</button>
      <button id="mForm">2 Form</button>
      <button id="mOrgan">3 Innereien</button>
      <button id="mAlign">4 Bild/Haut</button>
    </div>
    <div id="alignRows">
      <div class="row">
        <button id="nL">◀</button><button id="nR">▶</button><button id="nU">▲</button><button id="nD">▼</button>
        <button id="sM">−</button><button id="sP">+</button>
        <button id="rM">⟲</button><button id="rP">⟳</button>
        <button id="fine" class="sel">fein</button>
        <span class="hint" id="alignInfo"></span>
      </div>
      <div class="row">
        
        <label><input id="solo" type="checkbox" checked> Teile einzeln ausrichten (entkoppelt)</label>
        <label><input id="showSkin" type="checkbox"> Haut-Vorschau</label>
        <label>Bild-Deckkraft <input id="alpha" type="range" min="0" max="1" step="0.02" value="0.85"></label>
      </div>
    </div>
    <div id="formRows" class="row" style="display:none">
      <label><input id="protect" type="checkbox" checked> Schutzabstand zu Knochen</label>
      <label><input id="showBones" type="checkbox" checked> Knochen zeigen</label>
      <button id="resetPart">Teil zurücksetzen</button>
      <span class="row" id="multiRow"><button id="selMode" title="Rahmen aufziehen, um mehrere Punkte zu wählen (am PC: Umschalt+Klick oder Umschalt+Ziehen)">☐ Mehrfach-Auswahl</button><button id="pMove" class="sel">Verschieben</button><button id="pRot">Drehen</button><button id="pScale">Skalieren</button><button id="selClear">Auswahl aufheben</button><span class="hint" id="selInfo"></span></span>
    </div>
    <div id="boneRows" style="display:none">
      <div class="row">
        <button id="bMove" class="sel">Verschieben</button>
        <button id="bSpan" title="Startpunkt antippen, zum Endpunkt ziehen: der Knochen wird genau dazwischen gelegt">Start→Ende</button>
        <button id="bRot">Drehen</button>
        <button id="bScale">Skalieren</button>
        <button id="bJoint" title="Gelenkpunkte (gelbe Punkte) einzeln ziehen: die Knochen bleiben miteinander verbunden, auch wenn sie sich nicht überlappen">Gelenk verschieben</button>
        <span id="kScale" style="display:none"><label><input id="kLen" type="checkbox" checked> Länge</label> <label><input id="kWid" type="checkbox" checked> Breite</label></span>
        <button id="mAx" title="Spiegelt Form, Knochen und Finger dieses Teils an seiner Längsachse (z. B. Hand mit Daumen auf der anderen Seite). Im Spiel sieht es danach genau so aus wie hier. Nochmal drücken = zurück.">⇋ Teil spiegeln</button>
        <button id="bMeas" title="Längen von Ober-/Unterarm bzw. Ober-/Unterschenkel einstellen, Glied verschieben, Größe ändern, Maßstab prüfen">Maße …</button>
        <button id="bAsst" title="Gelenke der Vorlage nacheinander antippen (z. B. Schulter, Ellbogen, Handgelenk, Fingerspitze): die Knochen werden genau dorthin gelegt">Gelenke antippen</button>
        <button id="bFit" title="Alle Körperteil-Umrisse an die jetzige Knochenlage anpassen (rückgängig machbar)">Umriss an Knochen anpassen</button>
      </div>
      <details id="boneMore"><summary>Mehr …</summary>
        <div class="row">
          <select id="boneSel"></select>
          <button id="bLink">Fäden bearbeiten</button>
          <label><input id="showThreads" type="checkbox" checked> Fäden zeigen</label>
          <label><input id="allowBones" type="checkbox" checked> Knochen verschiebbar</label>
          <label><input id="withKids" type="checkbox"> mit Anhang</label>
        </div>
        <div class="row" id="layerRow"><span class="hint">Ebene (hinten → vorn):</span><span id="layerList"></span><button id="lFront">▲ nach vorn</button><button id="lBack">▼ nach hinten</button><button id="lStd">Standard</button></div>
        <div class="row" id="goRow"><span class="hint">Nur im Spiel verschieben (der Editor bleibt, wie er ist):</span><button id="goL">◀</button><button id="goU">▲</button><button id="goD">▼</button><button id="goR">▶</button><span id="goInfo" class="hint"></span><button id="goReset">auf 0</button></div>
        <div class="row"><label><input id="blendOn" type="checkbox"> Arme/Beine am Gelenk in den Körper überblenden (nur Grafik)</label><input id="blendR" type="range" min="3" max="14" step="0.5" value="8" title="Wie weit die Überblendung reicht (cm)"><span class="hint" id="blendInfo"></span></div>
        <div class="row">
          <button id="bFree">Knochen zurück</button>
          <button id="bFreePart" title="Alle Knochen (und Finger) des gewählten Körperteils zurück in die Grundlage">Teil-Knochen zurück</button>
          <button id="resetBones">Alle Knochen zurücksetzen</button>
          <button id="resetLinks">Fäden zurücksetzen</button>
        </div>
      </details>
    </div>
    <div id="organRows" style="display:none">
      <div class="row">
        <select id="orgSel"></select>
        <button id="oMove" class="sel">Verschieben</button>
        <button id="oRot">Drehen</button>
        <button id="oScale">Skalieren</button>
        <span id="oScaleOpts" style="display:none"><label><input id="oLen" type="checkbox" checked> Länge</label> <label><input id="oWid" type="checkbox" checked> Breite</label></span>
      </div>
      <div class="row">
        <label><input id="showOrgans" type="checkbox" checked> Innereien zeigen</label>
        <button id="resetOrgans">Innereien zurücksetzen</button>
      </div>
    </div>
    <div class="row" id="sliderRow">
      <label>Zoom <input id="zoom" type="range" min="0.25" max="6" step="0.01" value="1"></label>
      <span id="alignSliders"><label>Figur-Ebene <input id="asc" type="range" min="0.3" max="3" step="0.01" value="1"></label>
      <label>Drehung <input id="arot" type="range" min="-180" max="180" step="0.1" value="0"></label></span>
    </div>
    <div class="box"><canvas id="cv"></canvas><div id="pv"><canvas id="pvc"></canvas><div id="pvbar"><button id="pvP">＋</button><button id="pvM">－</button><button id="pvR">⌖</button><button id="pvBig">⛶</button><label><input id="pvLive" type="checkbox" checked>live</label></div></div><div id="chk"></div><div id="meas"></div><div id="ovl"><textarea id="ta" spellcheck="false"></textarea><div class="row"><button id="taCopy">Kopieren</button><button id="taLoad" class="main">Einlesen</button><button id="taClose">Schließen</button><span class="hint" id="taInfo"></span></div></div></div>
    <div class="hint" id="status"></div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const EMB = window.parent !== window;
const topQ = new URLSearchParams(location.search).get('top');
if (topQ) document.documentElement.style.setProperty('--top', Math.max(0, +topQ || 0) + 'px');
if (EMB) $('close').style.display = '';
const KINDS = [['zombie', 'Zombie'], ['fat', 'Fetter Zombie'], ['alien', 'Alien'], ['robot', 'Roboter']];
let GO = {};   // nur im Spiel: Versatz je Arm/Bein [dx,dy] cm
let BL = 0;    // nur Grafik: Überblend-Radius am Gelenk (cm), 0 = aus
let ZZ = null;   // Zeichen-Reihenfolge der Teile (null = Standard)
let JO = {};   // Gelenkpunkte einzeln verschoben: Name → [dx, dy] cm
let FL = new Set();   // gespiegelte Knochen (Form an der eigenen Längsachse gespiegelt)
let doneP = {};   // fertig (gesperrte) Körperteile der aktuellen Figur
const DONEKEY = (k) => 'zd_form_done_' + k;
const isDone = (p) => !!doneP[p];
const curDone = () => isDone($('part').value);
function flashLocked() { draftNote = '🔒 Dieses Teil ist „fertig“ und gesperrt – oben „Bearbeiten“ antippen, um es wieder freizugeben. '; draw(); }
function fillBoneSel() {
  const part = $('part').value, bs = $('boneSel'); bs.innerHTML = ''; bs.add(new Option('Knochen wählen …', ''));
  for (const b of info.bones) if (b.group === part) bs.add(new Option(b.label || b.name, b.name));
  if (sel && BN[sel] && BN[sel].group !== part) sel = null;
  bs.value = sel || '';
}
function foreignBone(n) { if (!n || !BN[n] || BN[n].group === $('part').value) return false; draftNote = `⚠ „${BN[n].label || n}“ gehört zu einem anderen Körperteil – oben das passende Teil wählen. `; draw(); return true; }
function refreshDone() {
  const o = $('part').options; for (let i = 0; i < o.length; i++) { const lab = (PARTS.find((q) => q[0] === o[i].value) || [0, o[i].value])[1]; o[i].textContent = (isDone(o[i].value) ? '🔒 ' : '') + lab; }
  const d = curDone(); $('btnDone').textContent = d ? '🔒 Bearbeiten' : '✔ Fertig'; $('btnDone').classList.toggle('sel', d);
}
const PARTS = [['torso', 'Rumpf + Kopf'], ['armN', 'Arm vorn'], ['armF', 'Arm hinten'], ['beinN', 'Bein vorn'], ['beinF', 'Bein hinten']];
for (const [id, l] of KINDS) $('kind').add(new Option(l, id));
for (const [id, l] of PARTS) $('part').add(new Option(l, id));
const S0 = 8, MARGIN = 1.3, TOL = 0.9, CMPX = 2.4;
const cv = $('cv'), c = cv.getContext('2d');
let info = null, saved = {}, work = {}, T = {}, links = {}, O = {}, selOrg = null, orgAct = 'move';   // T: Knochen -> [dx, dy, Grad, Maßstab] (absolut), links: Knochen -> {off:Set, on:Set}
let mode = 'bone', boneAct = 'move', pivotMode = 'joint', ref = null, fineMode = true;
let view = { z: 1, px: 0, py: 0 }, fitZ = 1;
let align = { s: 1, s0: 1, tx: 0, ty: 0, r: 0 };
const aligns = {}, touched = {};
let sel = null, samples = null, grid = null, dirty = true;
let cw = 800, ch = 500, dpr = 1, rot = 0;
const app = $('app');
const DRAFT = 'zd_form_draft_v2';

// ---------- IndexedDB (Referenzbild, Ausrichtung, Haut-Texturen) ----------
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('zd_form', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function kvGet(k) { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
async function kvDel(k) { try { const db = await idb(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }

function applyRot() {
  const W = window.innerWidth, H = window.innerHeight;
  app.classList.toggle('rot', rot !== 0);
  if (rot === 0) { app.style.cssText = ''; }
  else if (rot === 90) { app.style.width = H + 'px'; app.style.height = W + 'px'; app.style.transform = `translateX(${W}px) rotate(90deg)`; }
  else { app.style.width = H + 'px'; app.style.height = W + 'px'; app.style.transform = `translateY(${H}px) rotate(-90deg)`; }
}
function resize() { if (typeof pvResize === 'function') setTimeout(pvResize, 0); const atFit = ref && Math.abs(view.z - fitZ) < 1e-6; applyRot(); dpr = window.devicePixelRatio || 1; cw = cv.clientWidth; ch = cv.clientHeight; if (atFit) fitView(); cv.width = Math.max(10, Math.round(cw * dpr)); cv.height = Math.max(10, Math.round(ch * dpr)); draw(); }
window.addEventListener('resize', resize);

// ---------- Koordinaten: cm -(Figur-Ebene: Maßstab, Drehung, Verschiebung)-> Bild -(Ansicht)-> Schirm ----------
const kap = () => S0 * align.s;
const rr = () => (align.r * Math.PI) / 180;
// Spiegelachse je Körperteil aus der GRUNDFORM (stabil, unabhängig von späteren Änderungen und vom gerade gewählten Teil)
const mcCache = {};
function mcOf(part) { const b = info.base[part]; const k = info.kind + '/' + part; if (!mcCache[k]) { const bb = bboxOf(b); mcCache[k] = { cc: [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2], al: partAxis(b) }; } return mcCache[k]; }
function reflOf(part, sg) { const mc = mcOf(part), c2 = Math.cos(mc.al), s2 = Math.sin(mc.al), cc = mc.cc, R = [sg * (2 * c2 * c2 - 1), sg * 2 * c2 * s2, sg * 2 * c2 * s2, sg * (2 * s2 * s2 - 1)]; return [R[0], R[2], R[1], R[3], cc[0] - R[0] * cc[0] - R[1] * cc[1], cc[1] - R[2] * cc[0] - R[3] * cc[1]]; }
function Rtot() { return null; }   // Altmodus (Bild-Spiegelung) entfernt: gespiegelt wird jetzt die Form selbst (mirrorPart)
const applyM = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
function cmToImg(x, y) { const R = Rtot(align); if (R) [x, y] = applyM(R, x, y); const k = kap(), a = rr(), co = Math.cos(a), si = Math.sin(a); return [align.tx + k * (x * co - y * si), align.ty + k * (x * si + y * co)]; }
function imgToCm(ix, iy) { const k = kap(), a = rr(), co = Math.cos(a), si = Math.sin(a), dx = (ix - align.tx) / k, dy = (iy - align.ty) / k, r = [dx * co + dy * si, -dx * si + dy * co], R = Rtot(align); return R ? applyM(R, r[0], r[1]) : r; }
const cmToScr = (x, y) => { const [ix, iy] = cmToImg(x, y); return [ix * view.z + view.px, iy * view.z + view.py]; };
const scrToImg = (sx, sy) => [(sx - view.px) / view.z, (sy - view.py) / view.z];
const scrToCm = (sx, sy) => { const [ix, iy] = scrToImg(sx, sy); return imgToCm(ix, iy); };
const K = () => S0 * align.s * view.z;   // Schirm-Pixel je cm

// ---------- Knochen-Lagen ----------
let BN = {}, NAMES = [];
function subtree(name) { const s = new Set([name]); let again = true; while (again) { again = false; for (const b of info.bones) if (b.parent && s.has(b.parent) && !s.has(b.name)) { s.add(b.name); again = true; } } return s; }
function flipPt(b, x, y) { const g = b.ang || 0, ca = Math.cos(2 * g), sa = Math.sin(2 * g), dx = x - b.cx, dy = y - b.cy; return [b.cx + dx * ca + dy * sa, b.cy + dx * sa - dy * ca]; }
function bp(b, x, y) { return bpT(b, T[b.name], x, y); }
function moveBody(name, phi, k, q, e) {   // Drehung phi (Bogenmaß) und gleichmäßige Skalierung k um q, dann Verschiebung e
  const b = BN[name], t = T[name] || (T[name] = [0, 0, 0, 1, 1]);
  if (t.length < 5) t[4] = t[3] || 1;
  const cc = [b.cx + t[0], b.cy + t[1]], co = Math.cos(phi), si = Math.sin(phi), dx = (cc[0] - q[0]) * k, dy = (cc[1] - q[1]) * k;
  const nc = [q[0] + dx * co - dy * si + e[0], q[1] + dx * si + dy * co + e[1]];
  t[0] = nc[0] - b.cx; t[1] = nc[1] - b.cy; t[2] += (phi * 180) / Math.PI; t[3] = (t[3] || 1) * k; t[4] = (t[4] || 1) * k;
}
function scaleAniso(name, kl, kw, q, axis, shape) {   // Länge/Breite getrennt: Mittelpunkt wandert in Knochen-Achsen, Form nur beim gewählten Knochen
  const b = BN[name], t = T[name] || (T[name] = [0, 0, 0, 1, 1]);
  if (t.length < 5) t[4] = t[3] || 1;
  const cc = [b.cx + t[0], b.cy + t[1]], ca = Math.cos(axis), sa = Math.sin(axis), dx = cc[0] - q[0], dy = cc[1] - q[1];
  const lx = (ca * dx + sa * dy) * kl, ly = (-sa * dx + ca * dy) * kw;
  t[0] = q[0] + ca * lx - sa * ly - b.cx; t[1] = q[1] + sa * lx + ca * ly - b.cy;
  if (shape) { t[3] = (t[3] || 1) * kl; t[4] = (t[4] || 1) * kw; }
}
function parentJoint(name) { const b = BN[name]; if (!b || !b.parent) return null; return info.joints.find((j) => (j.a === name && j.b === b.parent) || (j.b === name && j.a === b.parent)) || null; }

  const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f), im = new Image();
  { const fr0 = new FileReader(); fr0.onload = () => { refOrig = fr0.result; saveRef(); }; fr0.readAsDataURL(f); }
  im.onload = () => { const m = Math.min(1, 4096 / Math.max(im.width, im.height)), cvs = document.createElement('canvas'); cvs.width = Math.round(im.width * m); cvs.height = Math.round(im.height * m); cvs.getContext('2d').drawImage(im, 0, 0, cvs.width, cvs.height); const small = new Image(); small.onload = () => { ref = small; refData = null; for (const k in aligns) delete aligns[k]; for (const k in touched) delete touched[k]; fitView(); fitAlign(); saveRef(); draw(); }; small.src = cvs.toDataURL('image/jpeg', 0.95); };
  im.src = url;

let resetSkins = false;
$('apply').onclick = async () => {
  $('status').textContent = 'Speichere …';
  const kind = info.kind, data = currentData();
  if (resetSkins) { for (const [p] of PARTS) await kvDel(`skin/${kind}/${p}`); resetSkins = false; }
  let made = [];
  if ($('useRef').checked && ref) for (const [p, l] of PARTS) { const key = kind + '/' + ($('solo').checked ? p : 'all'); if (!touched[key]) continue; const sk = genSkin(p); if (sk) { await kvSet(`skin/${kind}/${p}`, sk); made.push(l); } }

$('taClose').onclick = () => $('ovl').classList.remove('open');

window.addEventListener('message', (e) => { const d = e.data; if (!d || !d.zdFormInfo) return; if (d.error) { $('taInfo').textContent = d.error; return; } setInfo(d).then(() => $('ovl').classList.remove('open')); });
// ---------- Vorschau-Fenster (Echtzeit-Ergebnis aus dem Spiel) ----------
let pvBitmap = null, pvBusy = false, pvTimer = 0, pvDirty = false, pvView = { z: 1, x: 0, y: 0 }, pvBig = false;
const pvc = $('pvc'), pvx = pvc.getContext('2d'), pvSkins = {}, pvKeys = {};
function pvResize() { const r = $('pv').getBoundingClientRect(), d = window.devicePixelRatio || 1; const w = $('pv').clientWidth, h = $('pv').clientHeight; pvc.width = Math.max(10, Math.round(w * d)); pvc.height = Math.max(10, Math.round(h * d)); pvPaint(); void r; }
function pvPaint() {
  const w = pvc.width, h = pvc.height; pvx.setTransform(1, 0, 0, 1, 0, 0); pvx.fillStyle = '#1b1515'; pvx.fillRect(0, 0, w, h);
  if (!pvBitmap) { pvx.fillStyle = '#6a5a5a'; pvx.font = `${12 * (window.devicePixelRatio || 1)}px system-ui`; pvx.textAlign = 'center'; pvx.fillText($('pvLive').checked ? 'Vorschau lädt …' : 'Vorschau aus', w / 2, h / 2); return; }
  const fit = Math.min(w / pvBitmap.width, h / pvBitmap.height), k = fit * pvView.z;
  pvx.imageSmoothingQuality = 'high'; pvx.drawImage(pvBitmap, w / 2 - (pvBitmap.width * k) / 2 + pvView.x, h / 2 - (pvBitmap.height * k) / 2 + pvView.y, pvBitmap.width * k, pvBitmap.height * k);
}
function schedulePreview() { if (!info || !EMB || !$('pvLive').checked) return; pvDirty = true; if (pvTimer || pvBusy) return; pvTimer = setTimeout(sendPreview, 280); }
function sendPreview() {
  pvTimer = 0; if (!pvDirty || pvBusy || !info) return; pvDirty = false; pvBusy = true;
  const skins = {};
  if ($('useRef').checked && ref) for (const [p] of PARTS) { const key = info.kind + '/' + ($('solo').checked ? p : 'all'); if (!touched[key] || !aligns[key]) continue; const ck = JSON.stringify([aligns[key], work[p]]); if (pvKeys[p] !== ck) { const r = skinCanvas(p, aligns[key]), sc = Math.min(1, 512 / Math.max(r.cvs.width, r.cvs.height)), t = document.createElement('canvas'); t.width = Math.round(r.cvs.width * sc); t.height = Math.round(r.cvs.height * sc); t.getContext('2d').drawImage(r.cvs, 0, 0, t.width, t.height); pvSkins[p] = { dataUrl: t.toDataURL('image/jpeg', 0.85), fit: [r.ox * CMPX, r.oy * CMPX, (r.ox + r.bw) * CMPX, (r.oy + r.bh) * CMPX] }; pvKeys[p] = ck; } skins[p] = pvSkins[p]; }
  post({ zdForm: 'preview', kind: info.kind, data: currentData(), skins, w: 480, h: 840 });
  setTimeout(() => { if (pvBusy) { pvBusy = false; if (pvDirty) schedulePreview(); } }, 6000);
}
window.addEventListener('message', (e) => { const d = e.data; if (!d || !d.zdFormPreview) return; pvBusy = false; if (d.bitmap) { pvBitmap = d.bitmap; pvPaint(); } if (pvDirty) schedulePreview(); });
$('pvP').onclick = () => { pvView.z = Math.min(40, pvView.z * 1.4); pvPaint(); }; $('pvM').onclick = () => { pvView.z = Math.max(0.4, pvView.z / 1.4); pvPaint(); };
$('pvR').onclick = () => { pvView = { z: 1, x: 0, y: 0 }; pvPaint(); };
$('pvBig').onclick = () => { pvBig = !pvBig; $('pv').style.width = pvBig ? '320px' : '150px'; $('pv').style.height = pvBig ? '560px' : '262px'; pvResize(); };
$('pvLive').onchange = () => { if ($('pvLive').checked) { pvDirty = true; sendPreview(); } else pvPaint(); };
let pvDrag = null;
$('pv').addEventListener('pointerdown', (e) => { if (e.target.closest('#pvbar')) return; pvDrag = { x: e.clientX, y: e.clientY }; $('pv').setPointerCapture(e.pointerId); e.stopPropagation(); });
$('pv').addEventListener('pointermove', (e) => { if (!pvDrag) return; const d = window.devicePixelRatio || 1, f = rot === 0 ? 1 : 1; let dx = e.clientX - pvDrag.x, dy = e.clientY - pvDrag.y; if (rot === 90) [dx, dy] = [dy, -dx]; else if (rot === -90) [dx, dy] = [-dy, dx]; pvView.x += dx * d * f; pvView.y += dy * d * f; pvDrag = { x: e.clientX, y: e.clientY }; pvPaint(); });
$('pv').addEventListener('pointerup', () => { pvDrag = null; }); $('pv').addEventListener('pointercancel', () => { pvDrag = null; });
$('pv').addEventListener('wheel', (e) => { e.preventDefault(); e.stopPropagation(); pvView.z = Math.max(0.4, Math.min(40, pvView.z * (e.deltaY < 0 ? 1.2 : 1 / 1.2))); pvPaint(); }, { passive: false });
