p { margin:0; color:var(--muted); }
input { font:600 28px var(--f-mono); letter-spacing:.35em; text-align:center; text-transform:uppercase; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:12px 8px; width:100%; box-sizing:border-box; }
input:focus-visible, button:focus-visible { outline:2px solid var(--blood); outline-offset:2px; }
button { font:600 16px var(--f-body); background:var(--blood); color:#fff; border:0; border-radius:4px; padding:12px; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#msg { min-height:1.4em; font-size:14px; color:var(--muted); }
#msg.err { color:#ff6b61; }
#game { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
