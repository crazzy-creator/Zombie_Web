const INFO=`<h3>Befund: Ist-Zustand im Spiel</h3><ul>
<li>Wandaufprall = einige zufällige Ellipsen + Punkte. Größe hängt nur vom Radius ab, <b>nicht von der Geschwindigkeit</b>; die Flugrichtung wirkt nur auf den Startpunkt der Läufer.</li>
<li>Läufer: nur 18 bis 30 % der Flecken; feste Fallgeschwindigkeit (max. 95 px/s), konstante Breite, <b>zufällige Länge</b> statt Volumen. Keine Zähigkeit, kein Trocknen, kein Ausfransen, kein Zusammenlaufen.</li>
<li>Aufprallzeitpunkt zufällig (nicht geometrisch), Wand und Körper-Tropfen nur 40 bis 85 %. Danach nur Fleck, <b>kein Glanz</b>, kein Nachdunkeln.</li>
<li>Keine Kanten: Läufer enden am Boden ohne Pfütze-Anbindung, es gibt kein Abtropfen von Vorsprüngen.</li></ul>
<h3>Wie sich Blut an senkrechten Flächen verhält</h3><ul>
<li><b>Aufprall:</b> Ausbreitung wächst mit Tropfengröße und Geschwindigkeit (grob Aufprallenergie^¼). Schräg = ovaler Fleck, Spitze zeigt zur Herkunft des Tropfens; bei hoher Energie Randwulst, Spritzfinger und Satellitentropfen.</li>
<li><b>Haften:</b> Ein Tropfen rutscht erst, wenn sein Gewicht die Haftung übersteigt (Volumen-Schwelle, abhängig von Oberfläche: Glas klein, Beton groß).</li>
<li><b>Laufen:</b> Kopf (Kugelwulst) und dünne Spur. Die Spur frisst Volumen, deshalb werden Läufer kürzer und enden in einem Tropfen. Geschwindigkeit ~ Volumen / Zähigkeit.</li>
<li><b>Rauigkeit:</b> Haftstellen bremsen, Läufer schlängeln und halten kurz an (Stop-and-go).</li>
<li><b>Nässe:</b> Nasse Spuren ziehen weitere Läufer an, sie vereinigen sich und werden schneller.</li>
<li><b>Trocknen:</b> Blut wird zäher (Gerinnung) und dunkler; alte Läufer stoppen, alte Flecken sind matt.</li>
<li><b>Kanten:</b> An Simsen sammelt sich Blut und tropft ab, sobald der hängende Tropfen schwer genug ist.</li></ul>
<h3>Im Labor umgesetzt</h3><p>Aufprallformen (Stern, Flatsch, Komet, Nebel), Läufer mit Volumen, Zähigkeit, Haftkarte, Nässespur mit Anziehung, Perlen, Trocknen, Glanz, Sims mit Abtropfen, Boden. Unter „Export“ lässt sich eine Einstellung kopieren.</p>`;

  for(let i=0;i<10;i++){const a=r()*Math.PI*2,d=R*r()*.9;vDrop(c,x+Math.cos(a)*d,y+Math.sin(a)*d,(2.5+r()*3)*s,(1.6+r()*2)*s,a,.9)}}
};
function vlSrc(kind,x,y,s,o){ // Mitten der dicken Stellen, aus denen Läufer entstehen können
  if(kind==='thud'){const R0=40*s*(.7+.6*o.energy);return[{x,y,R:R0,r:R0/3.3}]}
  if(kind==='boom'){const R0=34*s*(.6+.8*o.energy)*.8;return[{x,y,R:R0,r:R0/4}]}
  if(kind==='cut'){const a=o.angle*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),L=150*s*o.length,w0=7*s*o.thick,out=[];for(let j=0;j<o.streaks;j++){const off=(j-(o.streaks-1)/2)*30*s*(.6+o.thick*.4);out.push({x:x-ca*L/2-sa*off+ca*L*.14,y:y-sa*L/2+ca*off+sa*L*.14,R:w0*1.7,r:w0*.85})}return out}
  if(kind==='smear'){const a=o.angle*Math.PI/180,Lm=200*s*o.length,Wm=70*s*o.width;return[{x:x-Math.cos(a)*Lm/2,y:y-Math.sin(a)*Lm/2,R:Wm*.3,r:Wm*.05}]}
  return[]}
function vlRuns(srcs,o){
  const pp=Object.assign({},P,{runSize:1,adhesion:o.adhesion,visc:o.visc,speedScale:o.speedScale,trailW:o.trailW,film:o.film,wetCarry:o.wetCarry,pickup:o.pickup,alpha:o.alpha,dark:o.dark}),Vc0=lerp(8,400,o.adhesion);
  for(const sr of srcs){if(sr.y>=FLOOR-6)continue;addWet(sr.x,sr.y,.6);if(Math.random()>o.runChance)continue;
    const n=Math.max(1,Math.round(o.runCount*rnd(.6,1.4)));
    for(let i=0;i<n&&slides.length<300;i++){const u=Math.sqrt(Math.random()),ang=rnd(.15,Math.PI-.15);
      slides.push({p:pp,x:sr.x+Math.cos(ang)*sr.R*u*.9,y:sr.y+Math.sin(ang)*sr.R*u*.7+sr.R*.1,vx:0,V:Vc0*(1+3*o.runSize)*rnd(.7,1.3),V0:Vc0,age:0,px:0,py:0,stuck:0,go:true,seed:Math.random()*100,col:rnd(.9,1.1),len:0,wMax:.9+4*o.runSize,bx:sr.x,by:sr.y,bR:sr.R})}}}
function vlStamp(x,y){const o=VL[VL.sel],c=sc;vlSet(o);c.save();c.beginPath();c.rect(0,0,W,FLOOR-2);c.clip();c.globalAlpha=o.alpha;VLF[VL.sel](c,mul32((Math.random()*1e9)|0),x,y,VL.scale,o);c.restore();bloodTotal+=300;vlRuns(vlSrc(VL.sel,x,y,VL.scale,o),o)}
function vlPreview(cvp){const c=cvp.getContext('2d');c.setTransform(1,0,0,1,0,0);c.fillStyle='#c8c4be';c.fillRect(0,0,cvp.width,cvp.height);vlSet(VL[VL.sel]);c.save();c.globalAlpha=VL[VL.sel].alpha;VLF[VL.sel](c,mul32(VL.seed),cvp.width/2,cvp.height/2,VL.scale,VL[VL.sel]);c.restore()}
// Verschiebbares Vorschaufenster: Original links, Nachbau rechts; bleibt über allen Reitern stehen
let vlWin=null,vlCv=null,vlImg=null,vlTitle=null;
VL.win=VL.win||{x:176,y:64,big:false,open:false};
try{const q=JSON.parse(localStorage.getItem('blutlabor_vl')||'null');if(q&&q.win)Object.assign(VL.win,q.win)}catch(e){}
function vlWinPlace(){if(!vlWin)return;const w=VL.win,ww=w.big?460:290;vlWin.style.width=ww+'px';w.x=clamp(w.x,0,Math.max(0,innerWidth-ww));w.y=clamp(w.y,0,Math.max(0,innerHeight-60));vlWin.style.left=w.x+'px';vlWin.style.top=w.y+'px'}
function vlWinEnsure(){
  if(vlWin)return;vlWin=document.createElement('div');vlWin.className='vlwin';vlWin.style.display='none';
  const head=document.createElement('div');head.className='vlhead';vlTitle=document.createElement('span');head.appendChild(vlTitle);
  const bs=document.createElement('button');bs.textContent='⤢';bs.title='Größe umschalten';bs.onclick=()=>{VL.win.big=!VL.win.big;vlWinPlace();vlSave()};
  const bx=document.createElement('button');bx.textContent='✕';bx.title='Schließen';bx.onclick=()=>vlWinShow(false);head.append(bs,bx);
  const body=document.createElement('div');body.className='vlbody';vlImg=document.createElement('img');vlImg.alt='Original';vlImg.onerror=()=>{vlImg.style.visibility='hidden'};vlImg.onload=()=>{vlImg.style.visibility='visible'};
  vlCv=document.createElement('canvas');vlCv.width=380;vlCv.height=320;body.append(vlImg,vlCv);
  const cap=document.createElement('div');cap.className='vlcap';cap.innerHTML='<span>Original</span><span>Nachbau</span>';
  const act=document.createElement('div');act.className='vlact';
  const dice=document.createElement('button');dice.textContent='Würfeln';dice.onclick=()=>{VL.seed=(Math.random()*1e6)|0;vlRedraw()};
  const put=document.createElement('button');put.textContent='An Wand setzen';put.title='Aktiviert das Werkzeug „Vorlage setzen“';put.onclick=()=>{tool='vl';buildTools();toast('Vorlage setzen: auf die Wand tippen')};
  act.append(dice,put);vlWin.append(head,body,cap,act);document.body.appendChild(vlWin);
  // Verschieben am Kopf
  let drag=null;head.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag={dx:e.clientX-VL.win.x,dy:e.clientY-VL.win.y};try{head.setPointerCapture(e.pointerId)}catch(err){}});
  head.addEventListener('pointermove',e=>{if(!drag)return;VL.win.x=e.clientX-drag.dx;VL.win.y=e.clientY-drag.dy;vlWinPlace()});
  const end=()=>{if(drag){drag=null;vlSave()}};head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
  window.addEventListener('resize',vlWinPlace);
}
function vlWinUpdate(){if(!vlWin)return;vlTitle.textContent='Vorlage: '+VLK[VL.sel].n;vlImg.style.visibility='hidden';vlImg.src='textures/blood/'+VL.sel+'.png'}
function vlWinShow(on){vlWinEnsure();VL.win.open=on;if(!on){VL.win.x=176;VL.win.y=64;VL.win.big=false}vlWin.style.display=on?'block':'none';if(on){vlWinPlace();vlWinUpdate();vlPreview(vlCv)}vlSave();buildTools()}
function vlRedraw(){if(vlWin&&vlWin.style.display!=='none')vlPreview(vlCv);vlSave()}
function buildVL(){
  pane.insertAdjacentHTML('beforeend','<h3>Vorlage wählen</h3>');
  const sel=document.createElement('select');sel.className='cselect';for(const k in VLK)sel.add(new Option(VLK[k].n,k));sel.value=VL.sel;sel.onchange=()=>{VL.sel=sel.value;vlSave();vlWinUpdate();vlRedraw();buildPane()};pane.appendChild(sel);
  const why=document.createElement('p');why.className='hint';why.textContent=VLK[VL.sel].why;pane.appendChild(why);
  const use=document.createElement('div');use.className='chk';const uc=document.createElement('input');uc.type='checkbox';uc.id='vl_use';uc.checked=!!VL.use[VL.sel];uc.onchange=()=>{VL.use[VL.sel]=uc.checked;vlSave()};const ul=document.createElement('label');ul.htmlFor='vl_use';ul.textContent='Im Spiel statt meinem Originalbild nutzen';use.append(uc,ul);pane.appendChild(use);
  const ug=document.createElement('p');ug.className='hint';ug.textContent='Wird im Spiel ausgelöst: '+VLK[VL.sel].game+'. Neu ab dem nächsten Schließen des Labors.';pane.appendChild(ug);
  const tg=document.createElement('button');tg.textContent=VL.win.open?'Vorschaufenster schließen':'Vorschaufenster öffnen (Original + Nachbau)';tg.className=VL.win.open?'on':'';tg.onclick=()=>{vlWinShow(!VL.win.open);buildPane()};pane.appendChild(tg);
  const sl=(label,obj,key,mn,mx,st)=>{const row=document.createElement('div');row.className='row';const l=document.createElement('label');l.textContent=label;const out=document.createElement('output');out.textContent=(+obj[key]).toFixed(st>=1?0:2);const r=document.createElement('input');r.type='range';r.min=mn;r.max=mx;r.step=st;r.value=obj[key];r.oninput=()=>{obj[key]=+r.value;out.textContent=(+r.value).toFixed(st>=1?0:2);vlRedraw()};row.append(l,out,r);pane.appendChild(row)};
  for(const[k,label,mn,mx,st]of VLO[VL.sel])sl(label,VL[VL.sel],k,mn,mx,st);
  sl('Größe',VL,'scale',.3,2.5,.01);
  const rb=document.createElement('button');rb.textContent='Neu würfeln';rb.onclick=()=>{VL.seed=(Math.random()*1e6)|0;vlRedraw()};pane.appendChild(rb);
  const rs=document.createElement('button');rs.textContent='Zurücksetzen';rs.onclick=()=>{VLO[VL.sel].forEach(o=>VL[VL.sel][o[0]]=o[5]);VL.scale=1;vlSave();vlRedraw();buildPane()};pane.appendChild(rs);
  const tp=document.createElement('p');tp.className='hint';tp.textContent='Das Vorschaufenster lässt sich am Kopf verschieben und bleibt über allen Reitern stehen. Zum Ausprobieren an der Wand: „Vorlage setzen“ wählen und tippen.';pane.appendChild(tp);
}
// ---------- Schleife ----------
let last=performance.now(),fps=0,fc=0,ft=0;
function frame(now){const dt0=Math.min(.05,(now-last)/1000);last=now;fc++;ft+=dt0;if(ft>.5){fps=Math.round(fc/ft);fc=0;ft=0}
  if(!paused){const dt=dt0*P.timeScale,n=Math.max(1,Math.ceil(dt/.012));for(let i=0;i<n;i++)step(dt/n);
    if(spraying){const p=pOf(spraying.x);spraying.t+=dt;const per=1/(p.sprayRate*Math.sqrt(p.amount));while(spraying.t>0){spraying.t-=per;const a=Math.atan2(spraying.dy,spraying.dx)+rnd(-1,1)*.25,s=rnd(500,1100);newDrop(spraying.x,spraying.y,Math.cos(a)*s,Math.sin(a)*s,dropR(p),p)}}}
  draw();$('hud').textContent=`${fps} fps · Tropfen ${drops.length} · Läufer ${slides.length} · Quellen ${leaks.length} · Blut ${Math.round(bloodTotal/100)}`;requestAnimationFrame(frame)}
window.__lab={get slides(){return slides},hit,step,clearAll,get P(){return P},rnd,blobRuns,vlStamp,VL};
applyLayout();
if(VL.win.open)vlWinShow(true);
{const sp=['stern','flatsch','komet','nebel'];const keep=P.style;[[.14,.2],[.34,.16],[.52,.24],[.72,.18],[.86,.3],[.28,.38]].forEach(([fx,fy],i)=>{const p=Object.assign({},P,{style:keep==='auto'?sp[i%4]:keep});for(let k=0;k<(i===2?4:1);k++)drops.push({x:W*fx+rnd(-30,30),y:H*fy+rnd(-20,20),vx:rnd(-60,60),vy:rnd(-60,60),r:i%2?7:5,p,wallT:.001,col:rnd(.9,1.1)})});for(let i=0;i<500;i++)step(.016)}
requestAnimationFrame(frame);
})();
