<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Texturen-Editor</title>
<style>
  html,body{margin:0;height:100%;background:#141010;color:#e6dcdc;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:6px;align-items:center;padding:6px;padding-top:calc(6px + max(env(safe-area-inset-top), var(--top, 0px)));padding-left:max(6px, env(safe-area-inset-left));padding-right:max(6px, env(safe-area-inset-right));position:relative;z-index:5;background:#1d1616;border-bottom:1px solid #4a3a3a;flex-wrap:wrap}
  header h1{font-size:15px;margin:0 8px 0 2px}
  button,select,label.btn{background:#2a2222;color:#ddd;border:1px solid #4a4040;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
  button.sel,button.main{background:#7a1318;border-color:#c4373e;color:#fff}
  main{flex:1;display:flex;gap:8px;padding:8px;min-height:0}
  .col{flex:1;display:flex;flex-direction:column;min-width:0;gap:6px}
  .box{flex:1;min-height:0;background:#0c0909;border:1px solid #3a2e2e;border-radius:10px;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
  input[type=range]{accent-color:#c4373e}
  .hint{font-size:12px;color:#a89898}
  @media (max-width:760px){main{flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Texturen-Editor</h1>
    <label class="btn">Bild laden<input id="file" type="file" accept="image/*" style="display:none"></label>
    <select id="target"></select>
    <button id="apply" class="main">Übernehmen</button>
    <button id="save">Als PNG</button>
    <button id="reset">Standard</button>
    <button id="close" style="display:none">Schließen</button>
  </header>
  <main>
    <div class="col">
      <div class="box"><canvas id="src"></canvas></div>
      <div class="row" id="fitRow" style="display:none">
        <button id="fitAuto">Automatisch: Körperteil antippen</button>
        <button id="fitReset">Form zurücksetzen</button>
        <button id="fitMx" title="Bild an der Längsachse des Körperteils spiegeln (Daumen-Seite)">⇋ Daumen-Seite</button>
        <button id="fitMy" title="Bild entlang der Querachse spiegeln (umdrehen)">⇅ Umdrehen</button>
        <button id="outMx">Ergebnis ⇋ spiegeln &amp; anwenden</button>
        <button id="outMy">Ergebnis ⇅ spiegeln &amp; anwenden</button>
        <label>Größe <input id="fitScale" type="range" min="0.3" max="2.2" step="0.01" value="1"></label>
        <span class="hint">Weiße Punkte ziehen. Auf die Linie tippen = Punkt hinzufügen, Doppeltipp auf Punkt = löschen. Innen ziehen = ganze Form verschieben.</span>
      </div>
      <div class="row" id="polyRow">
        <button id="polyClose">Polygon schließen</button>
        <button id="polyUndo">Punkt zurück</button>
        <button id="polyClear">Auswahl löschen</button>
        <span class="hint" id="polyInfo">Tippe Punkte um den Bildteil, der als Textur dienen soll.</span>
      </div>
    </div>
    <div class="col">
      <div class="box"><canvas id="prev"></canvas></div>
      <div class="row">
        <label>Helligkeit <input id="bright" type="range" min="0.5" max="1.6" step="0.02" value="1"></label>
        <label>Sättigung <input id="sat" type="range" min="0" max="2" step="0.05" value="1"></label>
        <label>Kachelgröße <input id="zoom" type="range" min="0.5" max="2.5" step="0.05" value="1"></label>
      </div>
      <div class="row">
        <label><input id="seamless" type="checkbox" checked> Nahtlos machen</label>
        <label><input id="rot" type="checkbox"> 90° drehen</label>
        <label id="fitLbl" style="display:none"><input id="fitOn" type="checkbox"> Form anpassen (Körperteil)</label>
        <span class="hint" id="info"></span>
      </div>
    </div>
  </main>
</div>

  if (on) $('fitScale').value = fitState().scale;
}

function fit(c) { const r = c.getBoundingClientRect(); const d = window.devicePixelRatio || 1; c.width = Math.max(10, Math.round(r.width * d)); c.height = Math.max(10, Math.round(r.height * d)); }
let view = { s: 1, ox: 0, oy: 0 };
function layout() {
  fit(src); fit(prev);
  if (img) { view.s = Math.min(src.width / img.width, src.height / img.height) * 0.96; view.ox = (src.width - img.width * view.s) / 2; view.oy = (src.height - img.height * view.s) / 2; }
  drawSrc(); drawPrev();
}
window.addEventListener('resize', layout);

function drawSrc() {
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.fillStyle = '#0c0909'; sc.fillRect(0, 0, src.width, src.height);
  if (!img) { sc.fillStyle = '#6a5a5a'; sc.font = `${16 * (window.devicePixelRatio || 1)}px system-ui`; sc.textAlign = 'center'; sc.fillText('„Bild laden“ wählen', src.width / 2, src.height / 2); return; }
  sc.drawImage(img, view.ox, view.oy, img.width * view.s, img.height * view.s);
  if (isFit()) {
    const st = fitState(), dpr = window.devicePixelRatio || 1;
    sc.beginPath(); st.pts.forEach(([x, y], i) => { const px = view.ox + x * view.s, py = view.oy + y * view.s; i ? sc.lineTo(px, py) : sc.moveTo(px, py); }); sc.closePath();
    sc.fillStyle = 'rgba(255,60,60,0.15)'; sc.fill(); sc.strokeStyle = '#ff5050'; sc.lineWidth = 2 * dpr; sc.stroke();
    for (const [x, y] of st.pts) { sc.beginPath(); sc.arc(view.ox + x * view.s, view.oy + y * view.s, 5 * dpr, 0, 6.3); sc.fillStyle = '#fff'; sc.fill(); sc.strokeStyle = '#a00'; sc.lineWidth = dpr; sc.stroke(); }
    return;
  }
  if (poly.length) {
    sc.beginPath();
    poly.forEach(([x, y], i) => { const px = view.ox + x * view.s, py = view.oy + y * view.s; i ? sc.lineTo(px, py) : sc.moveTo(px, py); });
    if (closed) sc.closePath();
    sc.fillStyle = 'rgba(255,60,60,0.18)'; if (closed) sc.fill();
    sc.strokeStyle = '#ff5050'; sc.lineWidth = 2 * (window.devicePixelRatio || 1); sc.stroke();
    for (const [x, y] of poly) { sc.beginPath(); sc.arc(view.ox + x * view.s, view.oy + y * view.s, 4 * (window.devicePixelRatio || 1), 0, 6.3); sc.fillStyle = '#fff'; sc.fill(); }
  }
}

function imgPos(e) { const r = src.getBoundingClientRect(); const d = src.width / r.width; return [((e.clientX - r.left) * d - view.ox) / view.s, ((e.clientY - r.top) * d - view.oy) / view.s]; }
src.addEventListener('pointerdown', (e) => {
  if (!isFit()) return;
  const [x, y] = imgPos(e), st = fitState(), dpr = window.devicePixelRatio || 1;
  if (autoMode) { autoMode = false; $('fitAuto').classList.remove('sel'); autoFit(x, y); return; }
  let bi = -1, bd = 22 * dpr / view.s;
  st.pts.forEach((q, i) => { const dd = Math.hypot(q[0] - x, q[1] - y); if (dd < bd) { bd = dd; bi = i; } });
  if (bi < 0) {
    // Punkt auf einer Kante hinzufügen
    let be = -1, bt = 0, bdist = 12 * dpr / view.s;
    const n = st.pts.length;
    for (let i = 0; i < n; i++) {
      const a = st.pts[i], b = st.pts[(i + 1) % n], vx = b[0] - a[0], vy = b[1] - a[1], l2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (y - a[1]) * vy) / l2));
      const dd = Math.hypot(a[0] + vx * t - x, a[1] + vy * t - y);
      if (dd < bdist) { bdist = dd; be = i; bt = t; }
    }
    if (be >= 0) {
      const a = st.pts[be], b = st.pts[(be + 1) % n], da = st.dst[be], db = st.dst[(be + 1) % n];
      st.pts.splice(be + 1, 0, [a[0] + (b[0] - a[0]) * bt, a[1] + (b[1] - a[1]) * bt]);
      st.dst.splice(be + 1, 0, [da[0] + (db[0] - da[0]) * bt, da[1] + (db[1] - da[1]) * bt]);
      bi = be + 1;
    }
  }
  if (bi >= 0) drag = { i: bi }; else drag = { all: true, x, y, orig: st.pts.map((q) => q.slice()) };
  src.setPointerCapture(e.pointerId); e.preventDefault(); build(true);
});
src.addEventListener('dblclick', (e) => {
  if (!isFit()) return;
  const [x, y] = imgPos(e), st = fitState(), dpr = window.devicePixelRatio || 1;
  if (st.pts.length <= 6) return;
  let bi = -1, bd = 22 * dpr / view.s;
  st.pts.forEach((q, i) => { const dd = Math.hypot(q[0] - x, q[1] - y); if (dd < bd) { bd = dd; bi = i; } });
  if (bi >= 0) { st.pts.splice(bi, 1); st.dst.splice(bi, 1); build(); }
});
src.addEventListener('pointermove', (e) => {
  if (!drag || !isFit()) return;
  const [x, y] = imgPos(e), st = fitState();
  if (drag.all) st.pts.forEach((q, i) => { q[0] = drag.orig[i][0] + x - drag.x; q[1] = drag.orig[i][1] + y - drag.y; });
  else { st.pts[drag.i][0] = x; st.pts[drag.i][1] = y; }
  build(true);
});
src.addEventListener('pointerup', () => { if (drag) { drag = null; build(); } });
src.addEventListener('pointerdown', (e) => {
  if (isFit() || !img || closed) return;
  const r = src.getBoundingClientRect(); const d = src.width / r.width;
  const x = ((e.clientX - r.left) * d - view.ox) / view.s, y = ((e.clientY - r.top) * d - view.oy) / view.s;
  if (x < 0 || y < 0 || x > img.width || y > img.height) return;
  if (poly.length > 2) { const [fx, fy] = poly[0]; if (Math.hypot(fx - x, fy - y) * view.s < 14 * (window.devicePixelRatio || 1)) { closed = true; build(); return; } }
  poly.push([x, y]); build();
});
$('polyClose').onclick = () => { if (poly.length > 2) { closed = true; build(); } };
$('polyUndo').onclick = () => { if (closed) closed = false; else poly.pop(); build(); };
$('polyClear').onclick = () => { poly = []; closed = false; build(); };

$('file').onchange = (e) => loadFile(e.target.files[0]);
function loadFile(f) {
  if (!f) return; const url = URL.createObjectURL(f); const im = new Image();
  im.onload = () => { img = im; poly = []; closed = false; for (const k in fitStates) delete fitStates[k]; refreshMode(); layout(); build(); };
  im.src = url;
}
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

/** Kachel (256×256) aus dem Bild bzw. dem Polygonausschnitt erzeugen */
function build(fast) {
  const c = tile.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 256, 256);
  if (!img) { drawSrc(); drawPrev(); return; }
  if (isFit()) { buildFit(fast); drawSrc(); drawPrev(); return; }
  let minX = 0, minY = 0, maxX = img.width, maxY = img.height;
  const use = closed && poly.length > 2;
  if (use) { minX = Math.min(...poly.map((p) => p[0])); maxX = Math.max(...poly.map((p) => p[0])); minY = Math.min(...poly.map((p) => p[1])); maxY = Math.max(...poly.map((p) => p[1])); }
  const w = Math.max(4, maxX - minX), h = Math.max(4, maxY - minY);
  // Ausschnitt auf Arbeitsfläche zeichnen (Außenbereich des Polygons = Durchschnittsfarbe)
  const work = document.createElement('canvas'); work.width = 256; work.height = 256; const wc = work.getContext('2d');
  const avg = averageColor(use);
  wc.fillStyle = avg; wc.fillRect(0, 0, 256, 256);
  wc.save();
  const k = Math.min(256 / w, 256 / h);
  wc.translate((256 - w * k) / 2, (256 - h * k) / 2); wc.scale(k, k); wc.translate(-minX, -minY);
  if (use) { wc.beginPath(); poly.forEach(([x, y], i) => i ? wc.lineTo(x, y) : wc.moveTo(x, y)); wc.closePath(); wc.clip(); }
  wc.drawImage(img, 0, 0);
  wc.restore();
  // Drehen, Helligkeit, Sättigung
  c.save();
  c.filter = `brightness(${$('bright').value}) saturate(${$('sat').value})`;
  if ($('rot').checked) { c.translate(128, 128); c.rotate(Math.PI / 2); c.translate(-128, -128); }
  c.drawImage(work, 0, 0);
  c.restore();
  if ($('seamless').checked) makeSeamless(c);
  $('info').textContent = img ? `Kachel 256×256 · Quelle ${img.width}×${img.height}` + (use ? ' · Polygon' : ' · ganzes Bild') : '';
  drawSrc(); drawPrev();
}
function averageColor(use) {
  const s = document.createElement('canvas'); s.width = s.height = 16; const x = s.getContext('2d'); x.drawImage(img, 0, 0, 16, 16);
  const d = x.getImageData(0, 0, 16, 16).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
}
/** Ränder weich ineinander blenden, damit die Kachel ohne Naht wiederholt werden kann */
function makeSeamless(c) {
  const S = 256, B = 40;
  const src0 = document.createElement('canvas'); src0.width = src0.height = S; src0.getContext('2d').drawImage(tile, 0, 0);
  const sh = document.createElement('canvas'); sh.width = sh.height = S; const x = sh.getContext('2d');
  x.drawImage(src0, S / 2, S / 2); x.drawImage(src0, -S / 2, S / 2); x.drawImage(src0, S / 2, -S / 2); x.drawImage(src0, -S / 2, -S / 2);
  // Maske: Mitte der verschobenen Kachel (Naht des Originals liegt dort) deckend, außen transparent
  const mask = document.createElement('canvas'); mask.width = mask.height = S; const m = mask.getContext('2d');
  const g = m.createRadialGradient(S / 2, S / 2, S / 2 - B * 2.2, S / 2, S / 2, S / 2 - 4);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  m.fillStyle = g; m.fillRect(0, 0, S, S);
  x.globalCompositeOperation = 'destination-in'; x.drawImage(mask, 0, 0);
  c.drawImage(sh, 0, 0);
}
['bright', 'sat', 'zoom', 'seamless', 'rot'].forEach((id) => $(id).addEventListener('input', build));
sel.addEventListener('change', () => { refreshMode(); build(); });
$('fitOn').addEventListener('change', () => { refreshMode(); build(); });
$('fitAuto').onclick = () => { autoMode = !autoMode; $('fitAuto').classList.toggle('sel', autoMode); $('info').textContent = autoMode ? 'Tippe jetzt im Bild auf das passende Körperteil.' : ''; };
$('fitReset').onclick = () => { delete fitStates[sel.value]; refreshMode(); build(); };
function fitReflect(along) {
  const st = fitState(), c = centroid(st.pts); let sxx = 0, syy = 0, sxy = 0;
  for (const q of st.pts) { const x = q[0] - c[0], y = q[1] - c[1]; sxx += x * x; syy += y * y; sxy += x * y; }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy); let ux = Math.cos(th), uy = Math.sin(th);
  if (!along) { const t = ux; ux = -uy; uy = t; }
  for (const q of st.pts) { const x = q[0] - c[0], y = q[1] - c[1], d = x * ux + y * uy; q[0] = c[0] + 2 * d * ux - x; q[1] = c[1] + 2 * d * uy - y; }
  build();
}
$('fitMx').onclick = () => { if (img && isFit()) fitReflect(true); else $('info').textContent = 'Erst „Form anpassen“ einschalten.'; };
$('fitMy').onclick = () => { if (img && isFit()) fitReflect(false); else $('info').textContent = 'Erst „Form anpassen“ einschalten.'; };
function flipOut(h) {
  const src = isFit() && fitCv ? fitCv : tile; if (!img || !src) return;
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const x = c.getContext('2d');
  x.translate(h ? c.width : 0, h ? 0 : c.height); x.scale(h ? -1 : 1, h ? 1 : -1); x.drawImage(src, 0, 0);
  const msg = { zdTex: true, name: sel.value, dataUrl: c.toDataURL('image/png') }; if (isFit()) msg.fit = fitBox;
  if (EMB) window.parent.postMessage(msg, '*'); else { try { localStorage.setItem('zd_tex_' + sel.value, msg.dataUrl); if (msg.fit) localStorage.setItem('zd_texfit_' + sel.value, JSON.stringify(msg.fit)); } catch (e) {} }
  $('info').textContent = 'Gespiegelt und übernommen.';
}
$('outMx').onclick = () => flipOut(true); $('outMy').onclick = () => flipOut(false);
$('fitScale').addEventListener('input', () => { const st = fitState(), k = +$('fitScale').value / st.scale, c = centroid(st.pts); st.pts.forEach((q) => { q[0] = c[0] + (q[0] - c[0]) * k; q[1] = c[1] + (q[1] - c[1]) * k; }); st.scale = +$('fitScale').value; build(); });

function drawPrev() {
  const W = prev.width, H = prev.height; pc.setTransform(1, 0, 0, 1, 0, 0);
  pc.fillStyle = '#0c0909'; pc.fillRect(0, 0, W, H);
  const id = sel.value; const t = TARGETS.find((x) => x[0] === id); const part = t && t[2];
  const pat = pc.createPattern(tile, 'repeat'); const zoom = +$('zoom').value;
  const sz = 150 * zoom; // im Spiel wiederholt sich die Textur alle 150 px
  if (!part) {
    const wall = id.startsWith('wall');
    pc.save(); pc.translate(0, wall ? 0 : H * 0.55);
    const k = (sz / 256) * (W / 600);
    pc.scale(k, k); pc.fillStyle = pat; pc.fillRect(0, 0, W / k, (wall ? H : H * 0.45) / k); pc.restore();
    return;
  }
  const o = OUT[part]; const xs = o.map((p) => p[0]), ys = o.map((p) => p[1]);
  const fitOn = isFit() && fitCv;
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const k = Math.min(W / (maxX - minX), H / (maxY - minY)) * 0.9;
  pc.save();
  pc.translate(W / 2 - ((minX + maxX) / 2) * k, H / 2 - ((minY + maxY) / 2) * k); pc.scale(k, k);
  pc.beginPath(); o.forEach(([x, y], i) => i ? pc.lineTo(x, y) : pc.moveTo(x, y)); pc.closePath();
  pc.save(); pc.clip();
  if (fitOn) pc.drawImage(fitCv, fitBox[0], fitBox[1], fitBox[2] - fitBox[0], fitBox[3] - fitBox[1]);
  else { const q = sz / 256; pc.scale(q, q); pc.fillStyle = pat; pc.fillRect(minX / q - 400, minY / q - 400, (maxX - minX) / q + 800, (maxY - minY) / q + 800); }
  pc.restore();
  pc.strokeStyle = '#000'; pc.lineWidth = 2 / k; pc.stroke();
  pc.restore();
}

function dataUrl() { return (isFit() && fitCv ? fitCv : tile).toDataURL('image/png'); }
$('apply').onclick = () => {
  if (!img) return;
  const msg = { zdTex: true, name: sel.value, dataUrl: dataUrl() };
  if (isFit()) msg.fit = fitBox;
  if (EMB) window.parent.postMessage(msg, '*');
  else { try { localStorage.setItem('zd_tex_' + sel.value, msg.dataUrl); if (msg.fit) localStorage.setItem('zd_texfit_' + sel.value, JSON.stringify(msg.fit)); else localStorage.removeItem('zd_texfit_' + sel.value); } catch (e) {} alert('Gespeichert (nur in diesem Browser). Für die App „Als PNG“ nutzen und die Datei in public/textures/ legen.'); }
};
$('save').onclick = () => { if (!img) return; const a = document.createElement('a'); a.href = dataUrl(); a.download = sel.value + '.png'; document.body.appendChild(a); a.click(); a.remove(); };
$('reset').onclick = () => { if (EMB) window.parent.postMessage({ zdTex: true, name: sel.value, dataUrl: null }, '*'); else { try { localStorage.removeItem('zd_tex_' + sel.value); } catch (e) {} } };
$('close').onclick = () => window.parent.postMessage({ zdTex: 'close' }, '*');
refreshMode(); layout(); build();
</script>
</body>
